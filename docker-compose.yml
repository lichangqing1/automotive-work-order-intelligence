services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: automotive
      POSTGRES_USER: automotive
      POSTGRES_PASSWORD: automotive
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automotive -d automotive"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://automotive:automotive@postgres:5432/automotive
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_NAMESPACE: ${RATE_LIMIT_NAMESPACE:-automotive-quality}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_AI_REQUESTS: ${RATE_LIMIT_AI_REQUESTS:-10}
      RATE_LIMIT_JIRA_REQUESTS: ${RATE_LIMIT_JIRA_REQUESTS:-10}
      RATE_LIMIT_MUTATION_REQUESTS: ${RATE_LIMIT_MUTATION_REQUESTS:-30}
      RATE_LIMIT_READ_REQUESTS: ${RATE_LIMIT_READ_REQUESTS:-120}
      RATE_LIMIT_READ_FAIL_OPEN: ${RATE_LIMIT_READ_FAIL_OPEN:-true}
      AI_CONCURRENCY_PER_PRINCIPAL: ${AI_CONCURRENCY_PER_PRINCIPAL:-2}
      AI_CONCURRENCY_LEASE_SECONDS: ${AI_CONCURRENCY_LEASE_SECONDS:-180}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ISSUE_TRACKER: ${ISSUE_TRACKER:-local}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-QA}
      API_AUTH_PRINCIPALS_JSON: ${API_AUTH_PRINCIPALS_JSON:-}
    command: sh -c "alembic upgrade head && uvicorn automotive_quality.api.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
