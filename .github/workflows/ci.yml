name: Automotive Quality Platform CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: automotive_test
          POSTGRES_USER: automotive
          POSTGRES_PASSWORD: automotive
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U automotive -d automotive_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://automotive:automotive@localhost:5432/automotive_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Migration test
        run: |
          alembic upgrade head
          alembic current
          alembic check
      - name: Unit, integration, API, and regression tests
        run: pytest --cov=automotive_quality --cov=automotive --cov-report=term-missing -q
      - name: AI regression evaluation and policies
        run: python scripts/run_ai_evaluation.py
      - name: Authoritative enterprise runtime smoke build
        run: python scripts/run_enterprise_platform.py --rows 1000 --dataset-version ci-smoke

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t automotive-quality-platform:test .

  landing:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_GITHUB_URL: https://github.com/lichangqing1/automotive-work-order-intelligence
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
