[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automotive-work-order-intelligence"
version = "2.0.0"
description = "Data and AI quality platform for automotive work orders"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "numpy>=1.24,<3",
  "pandas>=2,<3",
  "pydantic>=2,<3",
  "pydantic-settings>=2.2,<3",
  "psycopg[binary]>=3.1,<4",
  "PyYAML>=6,<7",
  "scikit-learn>=1.3,<2",
  "SQLAlchemy>=2,<3",
  "streamlit>=1.35,<2",
  "uvicorn>=0.27,<1",
]

[project.optional-dependencies]
ai = ["openai>=2,<3"]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["automotive*", "automotive_quality*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "postgres: requires a PostgreSQL DATABASE_URL and migrated schema",
  "jira_integration: creates a real Jira issue and requires explicit Jira credentials",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
